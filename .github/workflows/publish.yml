# Deploys on every push to the `production` branch.
#
# Only packages whose package.json version has not been released yet are
# deployed; everything else is skipped, so bumping one package never touches
# the others. To release: bump the version in the package's package.json, add
# a CHANGELOG.md entry, merge to main, then fast-forward `production` to main.
#
#   n8n-nodes-rendley  npm publish with provenance through npm Trusted Publishing
#                      (no token; the package's trusted publisher on npmjs.com is
#                      this repo, workflow publish.yml, environment `npm`)
#                      + GitHub release n8n-nodes-rendley-v<version>
#   zapier-rendley     GitHub release with build.zip attached; also pushed to
#                      Zapier when the ZAPIER_DEPLOY_KEY secret is set
#   apify-rendley      GitHub release; also pushed to Apify when the APIFY_TOKEN
#                      secret is set
#   make-rendley       no CLI deploy exists; import the folder with the Make
#                      VS Code extension
#
# Secrets: none required for npm. ZAPIER_DEPLOY_KEY and APIFY_TOKEN are
# optional repository secrets.

name: Publish

on:
  push:
    branches: [production]
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  detect:
    name: Find packages with an unreleased version
    runs-on: ubuntu-latest
    outputs:
      n8n: ${{ steps.check.outputs.n8n }}
      n8n_version: ${{ steps.check.outputs.n8n_version }}
      zapier: ${{ steps.check.outputs.zapier }}
      zapier_version: ${{ steps.check.outputs.zapier_version }}
      zapier_push: ${{ steps.check.outputs.zapier_push }}
      apify: ${{ steps.check.outputs.apify }}
      apify_version: ${{ steps.check.outputs.apify_version }}
      apify_push: ${{ steps.check.outputs.apify_push }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          HAS_ZAPIER_KEY: ${{ secrets.ZAPIER_DEPLOY_KEY != '' }}
          HAS_APIFY_TOKEN: ${{ secrets.APIFY_TOKEN != '' }}
        run: |
          set -eu
          version() { node -p "require('./packages/$1/package.json').version"; }
          released() { gh release view "$1" >/dev/null 2>&1; }

          v=$(version n8n-nodes-rendley)
          if [ -n "$(npm view "n8n-nodes-rendley@$v" version 2>/dev/null)" ]; then n8n=false; else n8n=true; fi
          echo "n8n=$n8n" >> "$GITHUB_OUTPUT"; echo "n8n_version=$v" >> "$GITHUB_OUTPUT"
          echo "n8n-nodes-rendley $v: publish=$n8n"

          v=$(version zapier-rendley)
          if released "zapier-rendley-v$v"; then zapier=false; else zapier=true; fi
          echo "zapier=$zapier" >> "$GITHUB_OUTPUT"; echo "zapier_version=$v" >> "$GITHUB_OUTPUT"
          echo "zapier_push=$HAS_ZAPIER_KEY" >> "$GITHUB_OUTPUT"
          echo "zapier-rendley $v: release=$zapier push=$HAS_ZAPIER_KEY"

          v=$(version apify-rendley)
          if released "apify-rendley-v$v"; then apify=false; else apify=true; fi
          echo "apify=$apify" >> "$GITHUB_OUTPUT"; echo "apify_version=$v" >> "$GITHUB_OUTPUT"
          echo "apify_push=$HAS_APIFY_TOKEN" >> "$GITHUB_OUTPUT"
          echo "apify-rendley $v: release=$apify push=$HAS_APIFY_TOKEN"

  n8n:
    name: n8n-nodes-rendley ${{ needs.detect.outputs.n8n_version }} to npm
    needs: detect
    if: needs.detect.outputs.n8n == 'true'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write   # provenance attestation
      contents: write   # GitHub release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Upgrade npm (Trusted Publishing needs npm 11.5.1 or newer)
        run: npm install -g npm@latest
      - run: npm ci
      - name: Lint, build, test, scan
        working-directory: packages/n8n-nodes-rendley
        run: |
          npm run lint
          npm run build
          npm test
          npm run scan
      - name: Publish with provenance
        working-directory: packages/n8n-nodes-rendley
        env:
          RELEASE_MODE: 'true'   # lets `n8n-node prerelease` allow npm publish
        run: npm publish --provenance --access public
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="n8n-nodes-rendley-v${{ needs.detect.outputs.n8n_version }}"
          gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --generate-notes

  zapier:
    name: zapier-rendley ${{ needs.detect.outputs.zapier_version }}
    needs: detect
    if: needs.detect.outputs.zapier == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: npm
      - run: npm ci
      - name: Validate, test, build
        working-directory: packages/zapier-rendley
        run: |
          npm run validate
          npm test
          npx zapier-platform build
      - name: Push to Zapier
        if: needs.detect.outputs.zapier_push == 'true'
        working-directory: packages/zapier-rendley
        env:
          ZAPIER_DEPLOY_KEY: ${{ secrets.ZAPIER_DEPLOY_KEY }}
        run: npx zapier-platform push
      - name: GitHub release with build.zip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="zapier-rendley-v${{ needs.detect.outputs.zapier_version }}"
          gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --generate-notes packages/zapier-rendley/build/build.zip

  apify:
    name: apify-rendley ${{ needs.detect.outputs.apify_version }}
    needs: detect
    if: needs.detect.outputs.apify == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: npm
      - run: npm ci
      - name: Test and validate
        working-directory: packages/apify-rendley
        run: |
          npm test
          npm run validate
          node --check src/main.js
      - name: Push to Apify
        if: needs.detect.outputs.apify_push == 'true'
        working-directory: packages/apify-rendley
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: npx apify push
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="apify-rendley-v${{ needs.detect.outputs.apify_version }}"
          gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --generate-notes
