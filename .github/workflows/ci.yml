name: CI

on:
  pull_request:
  push:
    branches: [main, production]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.package }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: rendley-client
            run: npm run typecheck
          - package: n8n-nodes-rendley
            run: |
              npm run typecheck
              npm run lint
              npm run build
              npm test
              npm run scan
              for f in templates/*.json; do node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))"; done
              git add -N dist && git diff --exit-code -- dist || { echo "dist is stale: run npm run build and commit dist"; exit 1; }
          - package: zapier-rendley
            run: |
              npm run typecheck
              npm run validate
              npm test
          - package: make-rendley
            run: npm test
          - package: apify-rendley
            run: |
              npm test
              npm run validate
              node --check src/main.js
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: npm
      - name: Install workspace
        run: npm ci
      - name: Check ${{ matrix.package }}
        working-directory: packages/${{ matrix.package }}
        run: ${{ matrix.run }}

  bundles-up-to-date:
    name: shared client bundle committed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: npm
      - run: npm ci
      - run: npm run build:client
      - run: git diff --exit-code packages/apify-rendley/src/rendley.js
