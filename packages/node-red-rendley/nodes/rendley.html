<script type="text/javascript">
  RED.nodes.registerType("rendley", {
    category: "Rendley",
    color: "#7664E9",
    defaults: {
      name: { value: "" },
      rendley: { value: "", type: "rendley-config", required: true },
      operation: { value: "aiAction", required: true },
      projectId: { value: "" },
      wait: { value: true },
      timeout: { value: 300, validate: RED.validators.number() },
    },
    inputs: 1,
    outputs: 1,
    icon: "rendley.svg",
    paletteLabel: "Rendley",
    label: function () {
      return this.name || "Rendley: " + this.operation;
    },
  });
</script>

<script type="text/html" data-template-name="rendley">
  <div class="form-row">
    <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
    <input type="text" id="node-input-name" />
  </div>
  <div class="form-row">
    <label for="node-input-rendley"><i class="fa fa-user"></i> Account</label>
    <input type="text" id="node-input-rendley" />
  </div>
  <div class="form-row">
    <label for="node-input-operation"><i class="fa fa-cog"></i> Operation</label>
    <select id="node-input-operation">
      <option value="aiAction">AI action (text to speech, image, video, dubbing, ...)</option>
      <option value="agentEdit">Edit video with AI agent</option>
      <option value="render">Render video (MP4)</option>
      <option value="estimateCost">Estimate credit cost</option>
      <option value="uploadMedia">Upload media from URL</option>
      <option value="getMediaUrl">Get media download URL</option>
      <option value="getJob">Get job status</option>
      <option value="waitForJob">Wait for job</option>
      <option value="getAgentJob">Get agent job status</option>
      <option value="waitForAgentJob">Wait for agent job</option>
      <option value="cancelAgentJob">Cancel agent job</option>
      <option value="createProject">Create project</option>
      <option value="getProject">Get project</option>
      <option value="listProjects">List projects</option>
      <option value="deleteProject">Delete project</option>
      <option value="listWorkspaces">List workspaces</option>
    </select>
  </div>
  <div class="form-row">
    <label for="node-input-projectId"><i class="fa fa-folder"></i> Project ID</label>
    <input type="text" id="node-input-projectId" placeholder="optional, overridden by msg.payload.project_id" />
  </div>
  <div class="form-row">
    <label for="node-input-wait"><i class="fa fa-clock-o"></i> Wait</label>
    <input type="checkbox" id="node-input-wait" style="width: auto" /> Wait for jobs to finish and return the result
  </div>
  <div class="form-row">
    <label for="node-input-timeout"><i class="fa fa-hourglass"></i> Timeout (s)</label>
    <input type="number" id="node-input-timeout" min="10" />
  </div>
</script>

<script type="text/html" data-help-name="rendley">
  <p>Calls the <a href="https://rendley.com" target="_blank">Rendley</a> API: AI video editing with the Rendley agent, AI actions (speech, transcription, dubbing, image, video and music generation, background removal, lip sync), media uploads, and MP4 rendering.</p>

  <h3>Inputs</h3>
  <dl class="message-properties">
    <dt>payload <span class="property-type">object</span></dt>
    <dd>The operation's inputs. <code>project_id</code> defaults to the node's Project ID field.</dd>
    <dt class="optional">operation <span class="property-type">string</span></dt>
    <dd>Overrides the node's operation.</dd>
  </dl>

  <h3>Outputs</h3>
  <dl class="message-properties">
    <dt>payload <span class="property-type">object</span></dt>
    <dd>The result. Jobs return <code>job_id</code>, <code>status</code>, <code>is_complete</code>, and once complete <code>download_url</code> (or <code>video_url</code> for renders), <code>media_id</code>, <code>file_hash</code>.</dd>
    <dt>rendley <span class="property-type">object</span></dt>
    <dd><code>{ operation, job_id }</code>.</dd>
  </dl>

  <h3>Operations and their payload fields</h3>
  <ul>
    <li><b>aiAction</b>: <code>action</code> (for example <code>text-to-speech</code>, <code>generate-image</code>, <code>generate-video</code>, <code>transcribe</code>, <code>video-translate</code>, <code>lipsync</code>, <code>voice-isolation</code>, <code>voice-changer</code>, <code>remove-video-background</code>, <code>remove-image-background</code>, <code>upscale-image</code>, <code>generate-music</code>, <code>generate-sound-effect</code>), <code>params</code> (model parameters; file inputs go in <code>params.media</code> as a URL, media ID or file hash; lipsync uses <code>video_media</code> and <code>audio_media</code>), optional <code>model_id</code>.</li>
    <li><b>agentEdit</b>: <code>prompt</code>, optional <code>project_id</code>, <code>file_urls</code>, <code>thread_id</code>.</li>
    <li><b>render</b>: <code>project_id</code>, optional <code>settings</code> (<code>codec</code>, <code>target_resolution</code>, <code>quality</code>).</li>
    <li><b>estimateCost</b>: <code>action</code> (an AI action or <code>export</code>), <code>params</code>.</li>
    <li><b>uploadMedia</b>: <code>file_url</code>, optional <code>file_name</code>.</li>
    <li><b>getMediaUrl</b>: <code>media_id</code> or <code>file_hash</code>.</li>
    <li><b>getJob</b>, <b>waitForJob</b>, <b>getAgentJob</b>, <b>waitForAgentJob</b>, <b>cancelAgentJob</b>: <code>job_id</code>.</li>
    <li><b>createProject</b>: <code>name</code>, optional <code>workspace_id</code>, <code>template_id</code>. <b>getProject</b>, <b>deleteProject</b>: <code>project_id</code>. <b>listProjects</b>: optional <code>workspace_id</code>.</li>
  </ul>

  <h3>Details</h3>
  <p>With <b>Wait</b> on, job operations poll Rendley until the job finishes or the timeout passes. With it off they return the job id immediately; follow up with <i>Get job status</i> or <i>Wait for job</i>. Download URLs are signed and expire after a few hours. The agent and renders need a paid Rendley plan; AI actions consume credits.</p>
</script>
